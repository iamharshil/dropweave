name: CI / CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build (Node ${{ matrix.node-version }} / Bun)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Check types
        run: bun run typecheck

      - name: Run test suite
        run: bun test

      - name: Build package
        run: bun run build

  publish:
    name: Auto-Publish to npm
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies & Build
        run: |
          bun install
          bun run build

      - name: Publish to npm (if version bumped)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/dropweave
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view dropweave version 2>/dev/null || echo "none")

          echo "Current package.json version: $CURRENT_VERSION"
          echo "Published npm registry version: $PUBLISHED_VERSION"

          if [ "$CURRENT_VERSION" != "$PUBLISHED_VERSION" ]; then
            if [ -z "$NODE_AUTH_TOKEN" ]; then
              echo "::error::NPM_TOKEN secret is not set in GitHub repository secrets. Please add it to enable auto-publishing."
              exit 1
            fi

            # Ensure npm auth token is written to both home and project .npmrc
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc

            echo "Verifying npm authentication..."
            npm whoami --registry https://registry.npmjs.org || echo "Could not verify whoami; continuing to publish..."

            echo "New version detected ($CURRENT_VERSION != $PUBLISHED_VERSION). Publishing to npm..."
            npm publish --access public --provenance || {
              if npm view "dropweave@$CURRENT_VERSION" >/dev/null 2>&1; then
                echo "Version $CURRENT_VERSION was already published. Skipping."
              else
                echo "Publish with provenance failed; retrying standard public publish..."
                npm publish --access public
              fi
            }
          else
            echo "Version $CURRENT_VERSION is already published on npm. Skipping publication."
          fi
